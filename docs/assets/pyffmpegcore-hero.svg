<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">PyFFmpegCore</title>
  <desc id="desc">Preflight, plan, run, and keep a receipt for repeatable FFmpeg jobs.</desc>
  <rect width="1200" height="360" fill="#0a0d0c"/>
  <g stroke="#27302d" stroke-width="1">
    <path d="M0 72h1200M0 144h1200M0 216h1200M0 288h1200"/>
    <path d="M120 0v360M240 0v360M360 0v360M480 0v360M600 0v360M720 0v360M840 0v360M960 0v360M1080 0v360"/>
  </g>
  <path d="M72 74h80l38 38-38 38H72V74Z" fill="none" stroke="#c8ff3d" stroke-width="8"/>
  <path d="M92 96h60M92 112h72M92 128h46" stroke="#f6f2e8" stroke-width="7"/>
  <text x="72" y="218" fill="#f6f2e8" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">PYFFMPEGCORE</text>
  <text x="74" y="263" fill="#9ca9a4" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="21" letter-spacing="1">PREFLIGHT  /  PLAN  /  RUN  /  RECEIPT</text>
  <g transform="translate(754 70)">
    <rect width="374" height="220" fill="#111614" stroke="#3f4a46" stroke-width="2"/>
    <rect width="374" height="34" fill="#1a211e"/>
    <circle cx="20" cy="17" r="5" fill="#c8ff3d"/>
    <text x="36" y="22" fill="#8fa099" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">PROOF CHANNEL / READY</text>
    <text x="20" y="72" fill="#c8ff3d" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">$ pyffmpegcore smoke-test</text>
    <text x="20" y="108" fill="#f6f2e8" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">Smoke test: PASS</text>
    <text x="20" y="136" fill="#a7b3ae" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">Synthetic input: mpeg4 320x180</text>
    <text x="20" y="164" fill="#a7b3ae" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">Verified thumbnail: 160x90</text>
    <path d="M20 190h334" stroke="#33403b"/>
    <text x="20" y="210" fill="#66e6ff" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12">NO UPLOADS · NO SHELL STRINGS</text>
  </g>
</svg>
