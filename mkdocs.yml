site_name: PyFFmpegCore
site_description: The safe, explainable FFmpeg task runner for the terminal, Python, and CI
site_url: https://othmaneblial.github.io/pyffmpegcore/
# The doubled path separator keeps Material from requesting releases/latest
# before the first release exists; GitHub serves the canonical repository.
repo_url: https://github.com//OthmaneBlial/pyffmpegcore
repo_name: OthmaneBlial/pyffmpegcore
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/mark.svg
  favicon: assets/mark.svg
  features:
    - navigation.instant
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle:
        icon: material/weather-night
        name: Switch to dark signal mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/weather-sunny
        name: Switch to light signal mode

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/site.js

copyright: Built in public. Tested against real FFmpeg. No telemetry by default.

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/OthmaneBlial/pyffmpegcore
      name: PyFFmpegCore on GitHub

nav:
  - Home: index.md
  - Five-minute start: quickstart.md
  - 63-second terminal proof: terminal-demo.md
  - Installation: installation.md
  - Workflow profiles: profiles.md
  - Capability preflight: preflight.md
  - Dry runs and plans: plans.md
  - Run receipts: receipts.md
  - Resumable batches: batches.md
  - Declarative pipelines: pipelines.md
  - Container image: container.md
  - GitHub Action: github-action.md
  - Performance: performance.md
  - Reproducible evidence: evidence.md
  - Community: community.md
  - Technical notes:
      - Capability preflight: notes/capability-preflight.md
      - Exact-size compression: notes/exact-size-compression.md
      - Deterministic plans: notes/deterministic-plans.md
      - Privacy-safe receipts: notes/privacy-safe-receipts.md
  - Recipes:
      - Overview: recipes/index.md
      - Web-compatible video: recipes/web-video.md
      - Exact-size upload: recipes/exact-size.md
      - Preserve every stream: recipes/preserve-streams.md
      - Audio extraction: recipes/audio-extraction.md
      - Podcast normalization: recipes/podcast.md
      - Subtitles: recipes/subtitles.md
      - Thumbnails: recipes/thumbnails.md
      - Image batches: recipes/image-batches.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
      - API stability: api-stability.md
      - Exit codes: exit-codes.md
      - JSON schemas: schemas.md
  - Operations:
      - Troubleshooting: troubleshooting.md
      - Compatibility: COMPATIBILITY.md
      - Security model: SECURITY_MODEL.md
      - Releasing: RELEASING.md
  - Project:
      - Comparison: comparison.md
      - Test methodology: test-methodology.md
      - Migration notes: migration.md
      - Changelog: https://github.com/OthmaneBlial/pyffmpegcore/blob/main/CHANGELOG.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

strict: true
