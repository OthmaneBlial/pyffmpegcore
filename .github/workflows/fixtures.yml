name: Cold-fixture compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cold-fixtures:
    name: Cold fixtures (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install project
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-index --no-deps --no-build-isolation -e .
      - name: Generate every fixture from scratch
        run: python tests/media/download_fixtures.py --force
      - name: Run package smoke test
        run: python -m pyffmpegcore smoke-test --json
      - name: Run representative real-media checks
        run: >-
          python -m pytest
          tests/test_probe_real.py
          tests/test_convert_real.py
          tests/test_progress_real.py
          tests/examples/test_examples_smoke_real.py
      - name: Save compatibility report
        run: python -m pyffmpegcore doctor --json > compatibility-report.json
      - name: Evaluate workflow capability catalog
        run: python -m scripts.validate_capability_catalog --json > capability-catalog-report.json
      - name: Upload drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-compatibility-${{ runner.os }}
          path: |
            compatibility-report.json
            capability-catalog-report.json
          if-no-files-found: warn
          retention-days: 30
