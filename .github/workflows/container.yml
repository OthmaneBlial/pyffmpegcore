name: Container

on:
  pull_request:
    paths:
      - "Containerfile"
      - "container-requirements.txt"
      - ".dockerignore"
      - "pyffmpegcore/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Containerfile"
      - "container-requirements.txt"
      - ".dockerignore"
      - "pyffmpegcore/**"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  schedule:
    - cron: "31 5 * * 3"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated multi-architecture image
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/othmaneblial/pyffmpegcore

jobs:
  build-scan-publish:
    name: Build, scan, and publish multi-architecture image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build local scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          load: true
          platforms: linux/amd64
          tags: pyffmpegcore:scan
          provenance: false
          sbom: false

      - name: Prove non-root runtime and installed media stack
        run: |
          test "$(docker run --rm --entrypoint id pyffmpegcore:scan -u)" = "10001"
          if docker run --rm --entrypoint python pyffmpegcore:scan -m pip --version; then
            echo "Runtime image must not retain pip" >&2
            exit 1
          fi
          test "$(docker run --rm --entrypoint python pyffmpegcore:scan -c 'from pathlib import Path; print(Path("/opt/pyffmpegcore").exists())')" = "False"
          docker run --rm pyffmpegcore:scan doctor --json > container-doctor.json
          docker run --rm pyffmpegcore:scan smoke-test --json > container-smoke.json
          docker run --rm --entrypoint ffmpeg pyffmpegcore:scan -version | head -n 1 > container-ffmpeg.txt

      - name: Generate complete vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pyffmpegcore:scan
          format: sarif
          output: trivy-results.sarif
          scanners: vuln
          exit-code: "0"

      - name: Block fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pyffmpegcore:scan
          format: json
          output: trivy-blocking.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          skip-setup-trivy: true
          exit-code: "1"

      - name: Build local arm64 scan image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          load: true
          platforms: linux/arm64
          tags: pyffmpegcore:scan-arm64
          provenance: false
          sbom: false

      - name: Prove arm64 non-root runtime and media stack under QEMU
        run: |
          test "$(docker run --rm --platform linux/arm64 --entrypoint id pyffmpegcore:scan-arm64 -u)" = "10001"
          docker run --rm --platform linux/arm64 pyffmpegcore:scan-arm64 doctor --json > container-doctor-arm64.json
          docker run --rm --platform linux/arm64 pyffmpegcore:scan-arm64 smoke-test --json > container-smoke-arm64.json

      - name: Generate complete arm64 vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pyffmpegcore:scan-arm64
          format: sarif
          output: trivy-results-arm64.sarif
          scanners: vuln
          skip-setup-trivy: true
          exit-code: "0"

      - name: Block fixed high and critical arm64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pyffmpegcore:scan-arm64
          format: json
          output: trivy-blocking-arm64.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln
          skip-setup-trivy: true
          exit-code: "1"

      - name: Upload scan and runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence-${{ github.run_id }}
          path: |
            container-doctor.json
            container-smoke.json
            container-ffmpeg.txt
            container-doctor-arm64.json
            container-smoke-arm64.json
            trivy-results.sarif
            trivy-blocking.json
            trivy-results-arm64.sarif
            trivy-blocking-arm64.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload vulnerability findings to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif
          category: pyffmpegcore-container

      - name: Log in to GHCR
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate immutable image metadata
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - name: Publish amd64 and arm64 image with SBOM and provenance
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Attest the published digest
        if: steps.publish.outcome == 'success'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
