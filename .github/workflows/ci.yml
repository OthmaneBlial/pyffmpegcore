name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project and quality tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check pyffmpegcore scripts examples tests
      - name: Check formatting
        run: python -m ruff format --check pyffmpegcore scripts examples tests
      - name: Type-check package and release tooling
        run: python -m mypy pyffmpegcore scripts
      - name: Compile Python sources
        run: python -m compileall -q pyffmpegcore scripts examples tests
      - name: Run fast tests
        run: python -m pytest -m "not real_media"

  python-matrix:
    name: Python ${{ matrix.python-version }} package contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run package contract tests
        run: >-
          python -m pytest
          tests/test_cli_packaging.py
          tests/test_cli_smoke.py
          tests/test_probe.py
          tests/test_progress.py
          tests/test_runner.py

  build-distributions:
    name: Build distributions once
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Build wheel and sdist
        run: python scripts/build_cli_artifacts.py --outdir dist --json > artifact-report.json
      - name: Validate metadata and rendered README
        run: python -m twine check dist/*.whl dist/*.tar.gz
      - name: Validate wheel contents
        run: python -m check_wheel_contents dist/*.whl
      - name: Record checksums
        working-directory: dist
        run: sha256sum pyffmpegcore-*.whl pyffmpegcore-*.tar.gz > SHA256SUMS
      - name: Include artifact report
        run: cp artifact-report.json dist/artifact-report.json
      - name: Upload immutable distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14

  artifact-smoke:
    name: Artifact smoke (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build-distributions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Download the distributions built once
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Generate fixtures from an empty directory
        run: python tests/media/download_fixtures.py --force
      - name: Evaluate capability rules on this FFmpeg build
        run: python -m scripts.validate_capability_catalog --json > capability-catalog-report.json
      - name: Install and exercise the exact wheel
        run: python scripts/validate_cli_install.py --artifact dist --json > compatibility-report.json
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compatibility-${{ runner.os }}-py${{ matrix.python-version }}
          path: |
            compatibility-report.json
            capability-catalog-report.json
          if-no-files-found: warn
          retention-days: 14

  documentation:
    name: Documentation contract
    needs: build-distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,docs]"
      - name: Verify generated references
        run: python scripts/generate_docs.py --check
      - name: Check local links and image alternatives
        run: python scripts/check_docs.py
      - name: Build searchable documentation strictly
        run: python -m mkdocs build --strict --clean
      - name: Download exact package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist
      - name: Verify documented package entry points
        run: python scripts/validate_cli_install.py --artifact dist --skip-media --json
      - name: Upload built documentation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: documentation-site
          path: site/
          if-no-files-found: error
          retention-days: 14

  coverage:
    name: Full coverage (Python 3.12)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Generate fixtures without cache reuse
        run: python tests/media/download_fixtures.py --force
      - name: Run the complete suite with the 80 percent gate
        run: python -m pytest --cov=pyffmpegcore --cov-report=term-missing --cov-report=xml:coverage.xml
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-python-3.12
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14
