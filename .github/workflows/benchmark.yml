name: Benchmarks

on:
  pull_request:
    paths:
      - "pyffmpegcore/**"
      - "scripts/benchmark_overhead.py"
      - ".github/workflows/benchmark.yml"
      - ".github/requirements/ci.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overhead:
    name: Orchestration overhead
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt
      - name: Install FFmpeg and project
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/ci.txt
          python -m pip install --no-index --no-deps --no-build-isolation -e .
      - name: Build wheel for size evidence
        run: python scripts/build_cli_artifacts.py --outdir dist --json > artifact-report.json
      - name: Measure startup, planning, probing, processing, artifact, and pipeline-cache behavior
        run: >-
          python scripts/benchmark_overhead.py
          --wheel dist/*.whl
          --output benchmark-report.json
          --strict
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            benchmark-report.json
            artifact-report.json
          if-no-files-found: warn
          retention-days: 30
