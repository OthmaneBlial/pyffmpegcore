name: Benchmarks

on:
  pull_request:
    paths:
      - "pyffmpegcore/**"
      - "scripts/benchmark_overhead.py"
      - ".github/workflows/benchmark.yml"
  push:
    branches: [main]
    paths:
      - "pyffmpegcore/**"
      - "scripts/benchmark_overhead.py"
      - ".github/workflows/benchmark.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overhead:
    name: Orchestration overhead
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and project
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Build wheel for size evidence
        run: python scripts/build_cli_artifacts.py --outdir dist --json > artifact-report.json
      - name: Measure startup, processing, artifact, and cache behavior
        run: >-
          python scripts/benchmark_overhead.py
          --wheel dist/*.whl
          --output benchmark-report.json
          --strict
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-${{ github.run_id }}
          path: |
            benchmark-report.json
            artifact-report.json
          if-no-files-found: warn
          retention-days: 30
