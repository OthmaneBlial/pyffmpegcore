name: Action integration

on:
  pull_request:
    paths:
      - "action.yml"
      - "Containerfile"
      - "scripts/run_pipeline_action.sh"
      - "tests/fixtures/action-pipeline.json"
      - ".github/workflows/action-integration.yml"
      - ".github/requirements/ci.txt"
  push:
    branches: [main]
    paths:
      - "action.yml"
      - "Containerfile"
      - "scripts/run_pipeline_action.sh"
      - "tests/fixtures/action-pipeline.json"
      - ".github/workflows/action-integration.yml"
      - ".github/requirements/ci.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-container-action:
    name: Local, container, and Action receipt parity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt
      - name: Install FFmpeg and local project
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --only-binary=:all: --require-hashes -r .github/requirements/ci.txt
          python -m build --wheel --no-isolation --outdir "$RUNNER_TEMP/pyffmpegcore-wheel"
          wheel_path="$(find "$RUNNER_TEMP/pyffmpegcore-wheel" -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          wheel_hash="$(sha256sum "$wheel_path" | awk '{print $1}')"
          printf '%s --hash=sha256:%s\n' "$wheel_path" "$wheel_hash" > "$RUNNER_TEMP/pyffmpegcore-wheel-requirements.txt"
          python -m pip install --no-index --no-deps --only-binary=:all: --require-hashes \
            -r "$RUNNER_TEMP/pyffmpegcore-wheel-requirements.txt"
      - name: Generate deterministic input
        run: |
          mkdir -p action-fixture
          ffmpeg -hide_banner -loglevel error \
            -f lavfi -i testsrc2=size=640x360:rate=24 \
            -t 2 -c:v mpeg4 -q:v 8 -pix_fmt yuv420p -y action-fixture/source.mp4
      - name: Run the pipeline locally
        env:
          OUTPUT: ../../local-output/poster.jpg
        run: |
          pyffmpegcore pipeline run tests/fixtures/action-pipeline.json \
            --var OUTPUT \
            --receipt-dir local-receipts \
            --state local-state.json \
            --events local-events.jsonl \
            --result-json > local-result.json
      - name: Run the same pipeline directly in the container
        env:
          OUTPUT: ../../container-output/poster.jpg
          IMAGE: ghcr.io/othmaneblial/pyffmpegcore@sha256:796661ae57874f07221e9ad258499b9a9473282544744615c7b40b719aadbc9a
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --network none \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env OUTPUT \
            "$IMAGE" \
            pipeline run tests/fixtures/action-pipeline.json \
            --var OUTPUT \
            --receipt-dir container-receipts \
            --state container-state.json \
            --events container-events.jsonl \
            --result-json > container-result.json
      - name: Run the repository Action
        uses: ./
        env:
          OUTPUT: ../../action-output/poster.jpg
        with:
          pipeline: tests/fixtures/action-pipeline.json
          environment: OUTPUT
          receipt-dir: action-receipts
          state: action-state.json
          events: action-events.jsonl
          result: action-result.json
          artifacts: action-output/**
          artifact-name: action-equivalence-${{ github.run_id }}
      - name: Compare normalized receipts and outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s local-output/poster.jpg
          test -s container-output/poster.jpg
          test -s action-output/poster.jpg
          filter='{schema_version, privacy, workflow: .plan.workflow, summary, preflight_ok: .items[0].preflight.ok, status: .items[0].result.status, exit_category: .items[0].result.exit_category}'
          jq -S "$filter" local-receipts/poster.receipt.json > local-normalized.json
          jq -S "$filter" container-receipts/poster.receipt.json > container-normalized.json
          jq -S "$filter" action-receipts/poster.receipt.json > action-normalized.json
          cmp local-normalized.json container-normalized.json
          cmp local-normalized.json action-normalized.json
