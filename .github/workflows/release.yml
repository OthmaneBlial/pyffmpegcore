name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build immutable release bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Require a signed tag for publication
        if: github.event_name == 'push'
        run: git tag --verify "$GITHUB_REF_NAME"
      - name: Verify tag and runtime versions agree
        if: github.event_name == 'push'
        run: python -c "import pyffmpegcore,os; expected='v'+pyffmpegcore.__version__; actual=os.environ['GITHUB_REF_NAME']; assert actual == expected, f'{actual} != {expected}'"
      - name: Install build tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Build wheel and sdist exactly once
        run: python scripts/build_cli_artifacts.py --outdir dist --json > artifact-report.json
      - name: Validate distributions
        run: python -m twine check dist/*.whl dist/*.tar.gz && python -m check_wheel_contents dist/*.whl
      - name: Record SHA-256 checksums
        working-directory: dist
        run: sha256sum pyffmpegcore-*.whl pyffmpegcore-*.tar.gz > SHA256SUMS
      - name: Include artifact report
        run: cp artifact-report.json dist/artifact-report.json
      - name: Upload immutable release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 14

  test-artifact:
    name: Test release (${{ matrix.os }}, Python ${{ matrix.python-version }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Generate deterministic fixtures
        run: python tests/media/download_fixtures.py --force
      - name: Validate exact release wheel
        run: python scripts/validate_cli_install.py --artifact dist --json

  attest:
    name: Attest release provenance
    if: github.event_name == 'push'
    needs: [build, test-artifact]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Attest wheel provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.whl
      - name: Attest source distribution provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: dist/*.tar.gz

  publish-pypi:
    name: Publish to PyPI with Trusted Publishing
    if: github.event_name == 'push'
    needs: [build, test-artifact, attest]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyffmpegcore/
    permissions:
      id-token: write
    steps:
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Publish immutable distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
          print-hash: true

  github-release:
    name: Create matching GitHub Release
    if: github.event_name == 'push'
    needs: [build, test-artifact, attest, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Download exact release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: dist
      - name: Create release with compatibility statement
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.whl dist/*.tar.gz dist/SHA256SUMS dist/artifact-report.json
          --verify-tag
          --title "pyffmpegcore $GITHUB_REF_NAME"
          --generate-notes
          --notes "Validated from the exact uploaded wheel on Ubuntu, macOS, and Windows with Python 3.10 and 3.14. Reproduce the flagship workflows from https://othmaneblial.github.io/pyffmpegcore/evidence/ and inspect the current compatibility policy at https://othmaneblial.github.io/pyffmpegcore/compatibility/. See the CI artifacts and PyPI provenance attestations for immutable evidence."
